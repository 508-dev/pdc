name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: ./scripts/lint.sh

      - name: Format
        run: uv run ruff format --check src tests

      - name: Typecheck
        run: ./scripts/typecheck.sh

      - name: Tests
        run: ./scripts/test.sh

      # The determinism suite is the one that must never be quietly skipped:
      # reproducibility is how anyone verifies a scenario against their own
      # mirror. Run it again on its own so a collection error cannot hide it.
      - name: Determinism
        run: uv run pytest -m determinism --strict-markers -v
